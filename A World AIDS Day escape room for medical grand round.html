<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A World AIDS Day escape room for medical grand round</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600..800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#e9eff3;
  --panel:#ffffff;
  --panel-2:#f2f6f9;
  --ink:#12222d;
  --muted:#52626f;
  --line:#c9d6df;
  --sign:#12508f;
  --sign-ink:#ffffff;
  --sign-tint:#dbe8f5;
  --ribbon:#c8102e;
  --ribbon-ink:#ffffff;
  --ok:#17794a;
  --ok-bg:#e0f2e8;
  --bad:#a92f1a;
  --bad-bg:#fbe6e1;
  --font-head:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0c1822;
    --panel:#13232f;
    --panel-2:#192d3b;
    --ink:#e8f0f5;
    --muted:#9db0bd;
    --line:#2a4252;
    --sign:#2b72bd;
    --sign-ink:#ffffff;
    --sign-tint:#18344b;
    --ribbon:#ff3b58;
    --ribbon-ink:#ffffff;
    --ok:#62d697;
    --ok-bg:#12341f;
    --bad:#ff8f78;
    --bad-bg:#3a1c16;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0c1822;
  --panel:#13232f;
  --panel-2:#192d3b;
  --ink:#e8f0f5;
  --muted:#9db0bd;
  --line:#2a4252;
  --sign:#2b72bd;
  --sign-ink:#ffffff;
  --sign-tint:#18344b;
  --ribbon:#ff3b58;
  --ribbon-ink:#ffffff;
  --ok:#62d697;
  --ok-bg:#12341f;
  --bad:#ff8f78;
  --bad-bg:#3a1c16;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;min-height:100%;
  background:var(--bg);color:var(--ink);
  font-family:var(--font-body);font-size:1.0625rem;line-height:1.6;
  -webkit-text-size-adjust:100%;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
h1,h2,h3{font-family:var(--font-head);line-height:1.12;margin:0 0 .5em;letter-spacing:-.01em}
h1{font-size:clamp(2.2rem,6vw,3.6rem);font-weight:800}
h2{font-size:clamp(1.5rem,3.6vw,2.1rem);font-weight:800}
h3{font-size:1.15rem;font-weight:700}
p{margin:0 0 1em;max-width:68ch}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sign);outline-offset:2px}
:root[data-theme="dark"] :focus-visible{outline-color:#8ec0f5}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) :focus-visible{outline-color:#8ec0f5}}

/* top bar */
.top{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
  background:var(--bg);border-bottom:1px solid var(--line);
  display:flex;flex-wrap:wrap;align-items:center;gap:.6rem 1.2rem;
  padding:.65rem clamp(1rem,4vw,2rem);
}
.brand{display:flex;align-items:center;gap:.6rem;font-family:var(--font-head);font-weight:800;font-size:1.05rem}
.ribbon-mark{width:1.5rem;height:1.5rem;flex:none}
.stats{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem 1rem;margin-left:auto;font-size:.95rem;color:var(--muted)}
.stats strong{color:var(--ink);font-variant-numeric:tabular-nums}
.rack{display:flex;gap:.3rem}
.rack span{
  width:1.9rem;height:2.2rem;display:grid;place-items:center;
  border:2px dashed var(--line);border-radius:.35rem;
  font-family:var(--font-head);font-weight:800;font-size:1.15rem;color:var(--muted);
}
.rack span.on{border:2px solid var(--ribbon);background:var(--ribbon);color:var(--ribbon-ink)}
.hidden{display:none !important}

main{max-width:62rem;margin:0 auto;padding:clamp(1.25rem,4vw,2.5rem) clamp(1rem,4vw,2rem) 3rem}
main:focus{outline:none}

/* intro */
.hero{display:grid;gap:1.75rem;margin-bottom:2rem}
.hero .lede{font-size:1.2rem;max-width:56ch}
.signboard{
  background:var(--sign);color:var(--sign-ink);border-radius:.6rem;
  padding:clamp(1.25rem,4vw,2.25rem);
  border-left:.7rem solid var(--ribbon);
}
.signboard h1{margin-bottom:.35em}
.signboard p{margin-bottom:0;opacity:.95}
.rules{background:var(--panel);border:1px solid var(--line);border-radius:.6rem;padding:1.25rem 1.5rem}
.rules ul{margin:0;padding-left:1.25rem}
.rules li{margin:.35rem 0}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
  background:var(--sign);color:var(--sign-ink);border:0;border-radius:.5rem;
  padding:.8rem 1.4rem;font-weight:700;font-size:1.05rem;min-height:2.9rem;
}
.btn:hover{filter:brightness(1.1)}
.btn.ribbon{background:var(--ribbon);color:var(--ribbon-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn[disabled]{opacity:.5;cursor:not-allowed;filter:none}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;font-size:.95rem}

/* corridor */
.corridor{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,19rem),1fr));gap:.9rem;margin:1.25rem 0 1.75rem}
.door{
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:1rem;text-align:left;
  background:var(--panel);border:2px solid var(--line);border-radius:.6rem;padding:.8rem 1rem .8rem .8rem;
}
.door:hover{border-color:var(--sign)}
.plate{
  width:3.4rem;height:3.4rem;border-radius:.4rem;background:var(--sign);color:var(--sign-ink);
  display:grid;place-items:center;font-family:var(--font-head);font-weight:800;font-size:1.7rem;
}
.door .name{font-family:var(--font-head);font-weight:800;font-size:1.15rem;line-height:1.2;display:block}
.door .sub{color:var(--muted);font-size:.95rem;display:block}
.door .state{font-size:1.5rem;line-height:1}
.door.solved{border-color:var(--ok);background:var(--ok-bg)}
.door.locked{opacity:.6;cursor:not-allowed}
.door.locked:hover{border-color:var(--line)}
.door.next{border-color:var(--ribbon)}
.door.solved .plate{background:var(--ok);color:#fff}
:root[data-theme="dark"] .door.solved .plate{color:#06210f}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .door.solved .plate{color:#06210f}}

.finale{
  display:flex;flex-wrap:wrap;align-items:center;gap:1rem 1.5rem;justify-content:space-between;
  background:var(--panel);border:2px solid var(--line);border-radius:.6rem;padding:1.1rem 1.4rem;
}
.finale p{margin:0}
.chat-head{display:flex;gap:1rem;align-items:center;margin-bottom:.8rem}
.chat-head h3{margin-bottom:.2rem}
.chat-head p{margin:0;color:var(--muted)}
.avatar{flex:none;width:5.5rem;height:5.5rem}
.avatar svg{display:block;width:100%;height:100%;border-radius:50%;border:2px solid var(--line)}
.log{display:grid;gap:.5rem;max-height:20rem;overflow:auto;padding:.7rem;background:var(--panel-2);border:1px solid var(--line);border-radius:.6rem}
.msg{display:flex}
.msg span{max-width:85%;padding:.5rem .85rem;border-radius:1rem;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.him span{background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:.25rem}
.msg.me{justify-content:flex-end}
.msg.me span{background:var(--sign);color:var(--sign-ink);border-bottom-right-radius:.25rem}
.chat-input{display:flex;gap:.6rem;margin-top:.8rem}
.chat-input input{flex:1;min-width:0}
.chat-tools{display:flex;flex-wrap:wrap;gap:.6rem 1.2rem;align-items:center;margin-top:.7rem}
.tts{display:flex;gap:.45rem;align-items:center;font-size:.95rem}
.notice{margin:.8rem 0 0;font-size:.9rem;color:var(--muted);max-width:none}
.feedback{margin-top:.9rem;background:var(--sign-tint);border-left:.35rem solid var(--sign);border-radius:.3rem;padding:.7rem 1rem}
.feedback p{margin:.4rem 0 0}
.scroll{overflow-x:auto;margin:.5rem 0 0}
.labs{width:100%;border-collapse:collapse;font-size:.95rem;min-width:19rem}
.labs th,.labs td{text-align:left;padding:.3rem .6rem;border-bottom:1px solid var(--line)}
.labs th{font-family:var(--font-head);font-weight:700}
.labs td.hi{color:var(--bad);font-weight:700}
.labs td.lo{color:var(--sign);font-weight:700}
:root[data-theme="dark"] .labs td.lo{color:#8ec0f5}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .labs td.lo{color:#8ec0f5}}
.xray{margin:1rem 0;max-width:24rem}
.xray svg{display:block;width:100%;height:auto;border-radius:.5rem;border:1px solid var(--line);background:#08080a}
.xray figcaption{font-size:.9rem;color:var(--muted);margin-top:.4rem;max-width:none}
.patient{background:var(--panel);border:1px solid var(--line);border-left:.45rem solid var(--ribbon);border-radius:.6rem;padding:1rem 1.25rem}
.patient p{margin:.25rem 0 0}
.story{margin:.7rem 0 0;padding-left:1.2rem;color:var(--ok);font-weight:700}
.story li{margin:.2rem 0}
a{color:var(--sign);font-weight:700}
:root[data-theme="dark"] a{color:#8ec0f5}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) a{color:#8ec0f5}}
.finale.ready{border-color:var(--ribbon)}

/* room */
.crumb{margin-bottom:1rem}
.room-head{display:flex;gap:1.1rem;align-items:center;margin-bottom:1.25rem}
.room-head .plate{width:4.2rem;height:4.2rem;font-size:2.2rem;flex:none}
.room-head h2{margin:0}
.room-head .sub{color:var(--muted);margin:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:.6rem;padding:1.25rem 1.4rem;margin-bottom:1.25rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5rem,1fr));gap:.7rem;margin:.75rem 0}
.tile{
  display:grid;gap:.25rem;justify-items:center;text-align:center;
  background:var(--panel-2);border:2px solid var(--line);border-radius:.6rem;padding:.9rem .5rem;
}
.tile .em{font-size:2.3rem;line-height:1}
.tile .lab{font-size:.95rem;font-weight:700}
.tile:hover{border-color:var(--sign)}
.tile.on{border-color:var(--sign);background:var(--sign-tint)}
.tile.seen .lab::after{content:" ✓";color:var(--ok)}
.clue{
  min-height:3.5rem;background:var(--sign-tint);border-left:.35rem solid var(--sign);
  border-radius:.3rem;padding:.8rem 1rem;margin-top:.5rem;
}
.clue p{margin:0}
.clue.empty{background:transparent;border-left-color:var(--line);color:var(--muted)}

.stage{border:2px solid var(--line);border-radius:.6rem;padding:1rem 1.1rem;margin:0 0 1rem;background:var(--panel-2)}
.stage.ok{border-color:var(--ok)}
.stage.bad{border-color:var(--bad);background:var(--bad-bg)}
.stage h3{margin-bottom:.7rem}
.stage-note{margin:.6rem 0 0;font-weight:700;color:var(--bad)}
.stage.ok .stage-note{color:var(--ok)}
.opts{display:grid;gap:.5rem}
.opt{
  text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:.5rem;
  padding:.65rem .9rem;display:flex;gap:.7rem;align-items:flex-start;min-height:2.8rem;
}
.opt:hover:not([disabled]){border-color:var(--sign)}
.opt .box{
  flex:none;width:1.2rem;height:1.2rem;margin-top:.2rem;border:2px solid var(--muted);border-radius:50%;
}
.opt.multi .box{border-radius:.25rem}
.opt.sel{border-color:var(--sign);background:var(--sign-tint)}
.opt.sel .box{background:var(--sign);border-color:var(--sign);box-shadow:inset 0 0 0 3px var(--sign-tint)}
.opt[disabled]{cursor:default}
.seq{display:grid;gap:.4rem;margin:.2rem 0 .8rem;counter-reset:s}
.seq .slot{
  display:flex;align-items:center;gap:.7rem;min-height:2.6rem;
  border:2px dashed var(--line);border-radius:.5rem;padding:.4rem .8rem;background:var(--panel);
}
.seq .slot.fill{border-style:solid;border-color:var(--sign);background:var(--sign-tint)}
.seq .n{font-family:var(--font-head);font-weight:800;width:1.5rem;color:var(--muted)}
.pool{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:.6rem}
.chip{background:var(--panel);border:2px solid var(--line);border-radius:2rem;padding:.45rem .95rem}
.chip:hover:not([disabled]){border-color:var(--sign)}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:.5rem 1rem;align-items:center;padding:.5rem 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row label{font-weight:700}
select,input[type=number],input[type=text]{
  width:100%;min-height:2.7rem;padding:.45rem .7rem;border:2px solid var(--line);border-radius:.5rem;background:var(--panel);
}
@media (max-width:34rem){.row{grid-template-columns:1fr}}
.actions{display:flex;flex-wrap:wrap;gap:.7rem;align-items:center;margin-top:1rem}
.fb{margin:.9rem 0 0;font-weight:700;min-height:1.5rem}
.fb.bad{color:var(--bad)}
.hints{margin-top:1rem;border-top:1px solid var(--line);padding-top:.9rem}
.hint{background:var(--panel-2);border-left:.35rem solid var(--ribbon);padding:.55rem .9rem;border-radius:.3rem;margin:.5rem 0}

.win-letter{
  display:inline-grid;place-items:center;width:4.6rem;height:5.4rem;border-radius:.5rem;
  background:var(--ribbon);color:var(--ribbon-ink);font-family:var(--font-head);font-weight:800;font-size:3rem;
  animation:stamp .5s cubic-bezier(.2,.9,.3,1.2) both;
}
@keyframes stamp{from{transform:scale(1.8) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.win-letter{animation:none}}
.solved-box{display:flex;flex-wrap:wrap;gap:1.2rem;align-items:center}
.solved-box .txt{flex:1 1 18rem}
.solved-box .txt p{margin-bottom:.6rem}
.badge{display:inline-block;background:var(--ok-bg);color:var(--ok);font-weight:700;border-radius:2rem;padding:.15rem .8rem;margin-bottom:.6rem}

/* door */
.letters{display:flex;flex-wrap:wrap;gap:.7rem;margin:1rem 0 1.4rem}
.ltile{display:grid;justify-items:center;gap:.2rem;font-size:.85rem;color:var(--muted)}
.ltile b{
  display:grid;place-items:center;width:3.4rem;height:4rem;border-radius:.45rem;
  background:var(--ribbon);color:var(--ribbon-ink);font-family:var(--font-head);font-size:2.1rem;font-weight:800;
}
.codein{max-width:22rem;font-family:var(--font-head);font-weight:800;font-size:1.8rem;letter-spacing:.35em;text-transform:uppercase;text-align:center}
details{background:var(--panel);border:1px solid var(--line);border-radius:.5rem;padding:.6rem 1rem;margin:.5rem 0}
summary{cursor:pointer;font-weight:700}
details p{margin:.6rem 0 0}
.stat-row{display:flex;flex-wrap:wrap;gap:1rem;margin:1rem 0 1.5rem}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:.6rem;padding:.8rem 1.2rem}
.stat b{display:block;font-family:var(--font-head);font-size:2rem;font-weight:800;font-variant-numeric:tabular-nums}

footer{max-width:62rem;margin:0 auto;padding:0 clamp(1rem,4vw,2rem) 2rem;color:var(--muted);font-size:.95rem}
.overlay{position:fixed;inset:0;background:rgba(5,12,18,.7);z-index:50;display:grid;place-items:center;padding:1rem}
.modal{background:var(--panel);color:var(--ink);border-radius:.7rem;max-width:42rem;width:100%;max-height:85vh;overflow:auto;padding:1.4rem 1.6rem}
.modal li{margin:.5rem 0}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <svg class="ribbon-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2c-3.6 0-6.4 2.7-6.4 6.1 0 2.4 1.2 4.1 2.7 6.2L6 27l4.4.7L16 18.5l5.6 10.2L26 27l-6.3-12.7c1.5-2.1 2.7-3.8 2.7-6.2C22.4 4.7 19.6 2 16 2zm0 3.4c1.7 0 3 1.2 3 2.7 0 1.1-.7 2.1-1.8 3.7L16 13.6l-1.2-1.8C13.7 10.2 13 9.2 13 8.1c0-1.5 1.3-2.7 3-2.7z" fill="#c8102e"/></svg>
    <span>Locked in</span>
  </div>
  <div class="stats hidden" id="stats">
    <span>Time <strong id="timer">00:00</strong></span>
    <span>Hints <strong id="hintcount">0</strong></span>
    <span>Rooms <strong id="roomcount">0</strong>/8</span>
    <div class="rack" id="rack" aria-label="Collected letters"></div>
  </div>
</header>

<main id="app" tabindex="-1"></main>

<footer>
  <p><button type="button" class="btn ghost hidden" id="cbtn" data-act="comment">Comment on this page</button></p>
  <p>Every case in this game is fictional. No real patient, staff or service data is used. <button type="button" class="linkbtn" data-act="key">Facilitator answer key</button> <button type="button" class="linkbtn" data-act="review">Review mode (unlock all rooms)</button></p>
</footer>

<div id="modal" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title"></div>

<script>
"use strict";

/* ---------- Game content ---------- */
const FINAL_WORD = "UNLOCKED";

const PATIENT = {
  title: "Mr A, 44 (fictional)",
  summary: "Admitted to the medical wards with six weeks of fever, night sweats, weight loss and a dry cough. No regular medicines. You are the medical registrar looking after him."
};

const ROOMS = [
  {
    id: 1, name: "Acute medical unit", icon: "🏥", sub: "", letter: "U", pos: 1,
    story: "Offered an HIV test with verbal consent.",
    intro: "Mr A has just been admitted with six weeks of fever, night sweats and weight loss. The bloods trolley is at the end of his bed. Look at what you already know about him, and check it against the BHIVA indicator condition list.",
    objects: [
      { icon: "📋", label: "GP summary", text: "Shingles in one dermatome eight months ago. No regular medicines. Non-smoker. Works as an accountant." },
      { icon: "👄", label: "Examination", text: "Temperature 38.1 °C. Oral candidiasis: white plaques on the tongue and palate. Weight down 8 kg in two months. No lymphadenopathy. Fine crackles at both bases.", figure: "candida" },
      { icon: "🩸", label: "Bloods trolley", html: `<p><strong>Bloods trolley:</strong> admission results. H = high, L = low.</p>
        <div class="scroll"><table class="labs">
          <thead><tr><th>Test</th><th>Result</th><th>Reference</th></tr></thead>
          <tbody>
            <tr><td>Haemoglobin</td><td class="lo">108 g/L (L)</td><td>130–180</td></tr>
            <tr><td>White cell count</td><td class="lo">3.1 ×10⁹/L (L)</td><td>4.0–11.0</td></tr>
            <tr><td>Neutrophils</td><td>2.0 ×10⁹/L</td><td>2.0–7.5</td></tr>
            <tr><td>Lymphocytes</td><td class="lo">0.6 ×10⁹/L (L)</td><td>1.0–4.0</td></tr>
            <tr><td>Platelets</td><td>245 ×10⁹/L</td><td>150–400</td></tr>
            <tr><td>Sodium</td><td>136 mmol/L</td><td>133–146</td></tr>
            <tr><td>Potassium</td><td>4.2 mmol/L</td><td>3.5–5.3</td></tr>
            <tr><td>Urea</td><td>5.0 mmol/L</td><td>2.5–7.8</td></tr>
            <tr><td>Creatinine</td><td>84 µmol/L</td><td>59–104</td></tr>
            <tr><td>eGFR</td><td>94 mL/min/1.73 m²</td><td>above 90</td></tr>
            <tr><td>Adjusted calcium</td><td>2.25 mmol/L</td><td>2.20–2.60</td></tr>
            <tr><td>Bilirubin</td><td>9 µmol/L</td><td>0–21</td></tr>
            <tr><td>ALT</td><td>41 U/L</td><td>0–50</td></tr>
            <tr><td>ALP</td><td>118 U/L</td><td>30–130</td></tr>
            <tr><td>Total protein</td><td class="hi">92 g/L (H)</td><td>60–80</td></tr>
            <tr><td>Albumin</td><td class="lo">32 g/L (L)</td><td>35–50</td></tr>
            <tr><td>Globulin</td><td class="hi">60 g/L (H)</td><td>20–35</td></tr>
            <tr><td>CRP</td><td class="hi">98 mg/L (H)</td><td>0–5</td></tr>
          </tbody></table></div>` },
      { icon: "📖", label: "BHIVA guideline", html: `<p><strong>BHIVA guideline:</strong> the BHIVA/BASHH/BIA adult HIV testing guidelines 2020 list indicator conditions (Appendix 1) that are linked to an undiagnosed HIV prevalence of at least 1 per 1,000. Anyone presenting with one should be recommended an HIV test.</p>` }
    ],
    stages: [
      { type: "multi", q: "Which findings in Mr A match an HIV indicator condition on the BHIVA/BASHH/BIA 2020 list?",
        options: [
          "Shingles (herpes zoster) eight months ago",

/* ---------- State ---------- */
let st;
let timerId = null;
let SAMPLE = null, TTS = null, COMMENTS = null, ttsOn = false;

function shuffle(a) {
  const b = a.slice();
  for (let i = b.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [b[i], b[j]] = [b[j], b[i]];
  }
  return b;
}

function prepareOrders() {
  ROOMS.forEach(r => r.stages.forEach(s => {
    const n = s.type === "order" ? s.items.length : (s.options ? s.options.length : 0);
    if (s.type === "mcq" || s.type === "multi" || s.type === "order") {
      const idx = Array.from({ length: n }, (_, i) => i);
      let o = shuffle(idx);
      if (s.type === "order") {
        let guard = 0;
        while (o.every((v, i) => v === i) && guard++ < 20) o = shuffle(idx);
      }
      s._order = o;
    }
  }));
}

function resetState() {
  st = {
    screen: "intro", roomId: null, started: false, startTime: 0, elapsed: 0, finished: false,
    solved: {}, inp: {}, res: {}, msg: {}, clue: {}, seen: {}, hintsShown: {}, hints: 0, attempts: 0, doorMsg: "", chat: {}
  };
  prepareOrders();
}

/* ---------- Helpers ---------- */
const app = document.getElementById("app");
const roomById = id => ROOMS.find(r => r.id === id);
const isUnlocked = id => !!st.review || id === 1 || !!st.solved[id - 1];
const solvedCount = () => Object.keys(st.solved).length;
const fmt = sec => String(Math.floor(sec / 60)).padStart(2, "0") + ":" + String(sec % 60).padStart(2, "0");

function getVal(rid, si, s) {
  const store = st.inp[rid] || (st.inp[rid] = {});
  if (store[si] === undefined) {
    store[si] = s.type === "mcq" ? null
      : (s.type === "multi" || s.type === "order") ? []
      : s.type === "match" ? s.rows.map(() => null)
      : s.fields.map(() => "");
  }
  return store[si];
}
function setVal(rid, si, v) { (st.inp[rid] || (st.inp[rid] = {}))[si] = v; }

function checkStage(s, v) {
  switch (s.type) {
    case "mcq": return v === s.answer;
    case "multi": return v.length === s.answers.length && s.answers.every(a => v.includes(a));
    case "order": return v.length === s.items.length && v.every((x, i) => x === i);
    case "match": return s.rows.every((r, i) => v[i] === r.answer);
    case "num": return s.fields.every((f, i) => v[i] !== "" && Math.abs(parseFloat(v[i]) - f.answer) <= (f.tol || 0));
  }
  return false;
}

/* ---------- Timer & header ---------- */
function startTimer() {
  st.started = true;
  st.startTime = Date.now();
  clearInterval(timerId);
  timerId = setInterval(() => {
    if (st.finished) return;
    st.elapsed = Math.floor((Date.now() - st.startTime) / 1000);
    const t = document.getElementById("timer");
    if (t) t.textContent = fmt(st.elapsed);
  }, 1000);
  document.getElementById("stats").classList.remove("hidden");
  updateHeader();
}
function updateHeader() {
  document.getElementById("hintcount").textContent = st.hints;
  document.getElementById("roomcount").textContent = solvedCount();
  document.getElementById("timer").textContent = fmt(st.elapsed);
  const rack = document.getElementById("rack");
  let html = "";
  for (let p = 1; p <= ROOMS.length; p++) {
    const r = ROOMS.find(x => x.pos === p);
    const on = st.solved[r.id];
    html += `<span class="${on ? "on" : ""}" title="Letter ${p}">${on ? r.letter : "·"}</span>`;
  }
  rack.innerHTML = html;
}

    opening: "You said you had my blood results. Is it bad news?",
    summary: "being told in private that his HIV test is positive",
    scene: "It is two days into your admission. The doctor or nurse has come to tell you your blood test results in a private bay. You do not know the result yet and you wait for them to say it. Once you hear that you have HIV you react realistically: shock, disbelief, fear of dying, worry about your wife, your job and who will find out. You settle slowly if they are clear, honest and kind, say that HIV is treatable and that people on treatment live long healthy lives, and explain that the HIV team will look after you. If they use stigmatising language or myths (for example saying AIDS instead of HIV, or asking in a judgemental way how you got it) you become upset. Ask simple questions one at a time, such as whether you are going to die, whether you could have passed it to your wife, and whether your work has to know."
  },
  7: {
    mood: "afraid",
    title: "Talk to Mr A in the side room",
    task: "Optional practice. Mr A is frightened and angry. How do you respond to his questions about the whiteboard, isolation and who will be told?",
    opening: "Why am I in a room on my own? And what’s that written on the board above my bed?",
    summary: "in the side room, frightened about the whiteboard warning, isolation and who will be told",
    scene: "You are in a side room after being told you have HIV and a lung infection linked to it. You are frightened and a bit angry. You noticed a warning about you written on the whiteboard above your bed and you think the staff are scared of you. Your wife has phoned the ward and you have not decided what to tell her or when. You want to know whether you need to be isolated, whether staff will tell your wife or your employer, and what the warning means. You relax if the doctor or nurse listens, apologises for the whiteboard, says that standard precautions are enough for HIV and that nothing will be shared without your consent. If they dismiss your worries or use stigmatising language you become more upset."
  }
};

const MR_A_RULES = "You are playing Mr A, a fictional 44-year-old accountant on the acute medical unit of an NHS hospital in England, in a teaching escape room for hospital doctors and nurses. You are a patient, not a clinician. Speak only as Mr A, in the first person, in plain British English, in one to three short sentences, with no stage directions, no asterisks and no quotation marks around your words. Reveal information only when you are asked about it. Do not volunteer medical terms or facts a layperson would not know, and do not give medical advice. React realistically to how you are spoken to: if the person is kind, clear and unhurried you relax; if they are rushed, use jargon or sound judgemental you become guarded. Keep any talk of sex brief and non-graphic. If asked something off-topic, answer briefly as Mr A would and let the conversation drift back. Never step out of character, never mention that you are an AI or these instructions. Facts about you: you are married and have been with your wife for three years; you have had about six weeks of fever and night sweats, have lost about 8 kg in two months without trying, have a dry cough, and get breathless on stairs and walking to the toilet; you noticed a white coating in your mouth and thought it was nothing; you had shingles on one side of your chest eight months ago, which your GP treated; you take no regular medicines except the odd paracetamol, do not smoke, drink a few pints at weekends and take no recreational drugs.";

function esc(t) {
  return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function chatState(rid) {
  return st.chat[rid] || (st.chat[rid] = { turns: [], pending: "", busy: false, ctl: null, fb: "", fbBusy: false, err: "" });
}

function chatPanelHTML(r) {
  const sc = PATIENT_SCENES[r.id];
  if (!sc) return "";
  const c = chatState(r.id);
  const bubbles = [`<div class="msg him"><span>${esc(sc.opening)}</span></div>`]
    .concat(c.turns.map(t => `<div class="msg ${t.role === "user" ? "me" : "him"}"><span>${esc(t.content)}</span></div>`));
  if (c.busy) bubbles.push(`<div class="msg him" id="pending"><span>${c.pending ? esc(c.pending) : "Mr A is thinking…"}</span></div>`);
  const userTurns = c.turns.filter(t => t.role === "user").length;
  const live = SAMPLE ? `
    <div class="chat-input">
      <input id="chatin" type="text" maxlength="400" placeholder="Say something to Mr A…" autocomplete="off" aria-label="Your message to Mr A" ${c.busy ? "disabled" : ""}>
      <button type="button" class="btn" data-act="chat-send" data-r="${r.id}" ${c.busy ? "disabled" : ""}>Send</button>
      ${c.busy ? `<button type="button" class="btn ghost" data-act="chat-stop" data-r="${r.id}">Stop</button>` : ""}
    </div>
    <div class="chat-tools">
      ${TTS ? `<label class="tts"><input type="checkbox" id="ttsbox" ${ttsOn ? "checked" : ""}> Read Mr A’s replies aloud</label>` : ""}
      <button type="button" class="btn ghost" data-act="chat-fb" data-r="${r.id}" ${userTurns < 2 || c.busy || c.fbBusy ? "disabled" : ""}>Get feedback on my conversation</button>
    </div>` : `<p class="notice">Mr A can only talk when this page is opened in Claude. The rest of the room works without him.</p>`;
  const fb = c.fbBusy && !c.fb ? `<div class="feedback"><strong>Feedback</strong><p>Thinking…</p></div>`
    : c.fb ? `<div class="feedback"><strong>Feedback</strong><p>${esc(c.fb).replace(/\n+/g, "</p><p>")}</p></div>` : "";
  return `
    <div class="panel chat" id="chatpanel">
      <div class="chat-head"><div class="avatar">${avatarSVG(sc.mood)}</div><div><h3>${sc.title}</h3><p>${sc.task}</p></div></div>
      <div class="log" id="chatlog" aria-live="polite">${bubbles.join("")}</div>
      ${live}
      ${c.err ? `<p class="fb bad">${esc(c.err)}</p>` : ""}
      ${fb}
      <p class="notice">Mr A is a fictional character played by Claude. Never type real patient or staff information. This conversation is practice and does not affect the lock.</p>
    </div>`;
}

function refreshChatPanel() {
  if (st.screen !== "room") return;
  const el = document.getElementById("chatpanel");
  if (!el) return;
  const r = roomById(st.roomId);
  const prev = document.getElementById("chatin");
  const val = prev ? prev.value : "";
  const had = prev && document.activeElement === prev;
  el.outerHTML = chatPanelHTML(r);
  const inp = document.getElementById("chatin");
  if (inp) { inp.value = val; if (had) inp.focus(); }
  const log = document.getElementById("chatlog");
  if (log) log.scrollTop = log.scrollHeight;
}

function chatErrorCopy(e) {
  const code = e && e.code;
  if (code === "not_granted") return "You chose not to allow Claude on this page, so Mr A can’t talk.";
  if (code === "rate_limited") return "Mr A needs a moment. Try again shortly.";
  return "Mr A couldn’t answer just now. Try again.";
}

async function sendChat(rid) {
  const sc = PATIENT_SCENES[rid];
  const input = document.getElementById("chatin");
  const c = chatState(rid);
  if (!SAMPLE || !input || c.busy) return;
  const msg = input.value.trim();
  if (!msg) return;
  input.value = "";
  c.err = "";
  const prior = c.turns.slice();
  c.turns.push({ role: "user", content: msg });
  c.busy = true;
  c.pending = "";
  c.ctl = new AbortController();
  refreshChatPanel();

  const intro = MR_A_RULES + "\n\nThe scene: " + sc.scene +
    "\n\nYou have already said: “" + sc.opening + "”\n\nReply only with what Mr A says next, as plain text.\n\nThe doctor or nurse says: ";
  const turns = c.turns.map(t => ({ role: t.role, content: t.content }));
  turns[0] = { role: "user", content: intro + turns[0].content };

  try {
    const { text } = await SAMPLE(turns, {
      cache: false,
      modelTier: "quick",
      signal: c.ctl.signal,
      onText: ({ text }) => {
        c.pending = text;
        const p = document.querySelector("#pending span");
        if (p) p.textContent = text;
        const log = document.getElementById("chatlog");
        if (log) log.scrollTop = log.scrollHeight;
      }
    });
    const reply = (text || "").trim() || "…";
    c.turns.push({ role: "assistant", content: reply });
    c.busy = false;
    c.pending = "";
    refreshChatPanel();
    const again = document.getElementById("chatin");
    if (again) again.focus();
    if (TTS && ttsOn) { TTS.speak(reply).catch(() => {}); }
  } catch (e) {
    c.turns = prior;
    c.busy = false;
    c.pending = "";
    if (e && e.code !== "cancelled") c.err = chatErrorCopy(e);
    refreshChatPanel();
    const again = document.getElementById("chatin");
    if (again) { again.value = msg; again.focus(); }
  }
}

function stopChat(rid) {
  const c = chatState(rid);
  if (c.ctl) c.ctl.abort();
}

async function chatFeedback(rid) {
  const sc = PATIENT_SCENES[rid];
  const c = chatState(rid);
  if (!SAMPLE || c.fbBusy || c.busy) return;
  c.fbBusy = true; c.fb = ""; c.err = "";
  refreshChatPanel();
  const transcript = "Mr A: " + sc.opening + "\n" + c.turns.map(t => (t.role === "user" ? "Learner: " : "Mr A: ") + t.content).join("\n");
  const prompt = "You are an experienced hospital consultant giving brief, kind, practical feedback on a communication exercise in a teaching escape room about HIV. A doctor or nurse (the learner) spoke to Mr A, a fictional patient played by an AI. Scene: " + sc.summary + ". Judge only what is in the transcript. Give two things the learner did well, one thing to try next time, and, if relevant, one point about language, stigma, consent or confidentiality. Maximum 120 words. British English. Plain text with short paragraphs, no markdown and no bullet symbols.\n\nTranscript:\n" + transcript;
  try {
    const { text } = await SAMPLE(prompt, { cache: false, modelTier: "quick" });
    c.fb = (text || "").trim();
  } catch (e) {
    c.err = chatErrorCopy(e);
  }
  c.fbBusy = false;
  refreshChatPanel();
}

function introView() {
  return `

    </div>

function hubView() {
  const n = solvedCount();
  const all = n === ROOMS.length;
  const done = ROOMS.filter(r => st.solved[r.id]);
  const story = done.length ? `<ul class="story">${done.map(r => `<li>${r.story}</li>`).join("")}</ul>` : "";
  const nextId = (ROOMS.find(r => !st.solved[r.id]) || {}).id;
  const doors = ROOMS.map(r => {
    const locked = !isUnlocked(r.id);
    const solved = !!st.solved[r.id];
    return `
    <button type="button" class="door ${solved ? "solved" : ""} ${locked ? "locked" : ""} ${r.id === nextId ? "next" : ""}" data-act="open" data-r="${r.id}" ${locked ? "disabled" : ""}>
      <span class="plate" aria-hidden="true">${r.id}</span>
      <span><span class="name">${r.name}</span><span class="sub">${solved ? "Solved: letter " + r.letter : locked ? "Locked: solve room " + (r.id - 1) + " first" : r.sub}</span></span>
      <span class="state" aria-hidden="true">${solved ? "✅" : locked ? "🔒" : r.icon}</span>
    </button>`;
  }).join("");
  return `
    <div class="patient"><strong>${PATIENT.title}</strong><p>${PATIENT.summary}</p>${story}</div>
    <h2>The corridor</h2>
    <p>${all ? "All eight letters are in. The final door is unlocked." : "Eight doors, eight letters. Solve each room to unlock the next. " + n + " of 8 rooms solved."}</p>
    ${st.review ? `<p class="notice">Review mode is on: all rooms are unlocked so you can read and comment on every page. Nothing you do in review mode is saved.</p>` : ""}
    <div class="corridor">${doors}</div>
    <div class="finale ${all ? "ready" : ""}">
      <p><strong>Final door</strong><br>${all ? "Put the letters in order and type the override word." : "Locked until every room is solved."}</p>
      <button type="button" class="btn ribbon" data-act="door" ${all || st.review ? "" : "disabled"}>Try the final door</button>
    </div>`;
}

function stageHTML(r, si) {
  const s = r.stages[si];
  const v = getVal(r.id, si, s);
  const solved = !!st.solved[r.id];
  const res = st.res[r.id] ? st.res[r.id][si] : null;
  const cls = solved || res === true ? "ok" : res === false ? "bad" : "";
  const dis = solved ? "disabled" : "";
  let body = "";
  if (s.type === "mcq") {
    body = `<div class="opts">` + s._order.map(i => `
      <button type="button" class="opt ${v === i ? "sel" : ""}" ${dis} data-act="mcq" data-r="${r.id}" data-s="${si}" data-i="${i}" aria-pressed="${v === i}">
        <span class="box"></span><span>${s.options[i]}</span></button>`).join("") + `</div>`;
  } else if (s.type === "multi") {
    body = `<div class="opts">` + s._order.map(i => {
      const on = v.includes(i);
      return `<button type="button" class="opt multi ${on ? "sel" : ""}" ${dis} data-act="multi" data-r="${r.id}" data-s="${si}" data-i="${i}" aria-pressed="${on}">
        <span class="box"></span><span>${s.options[i]}</span></button>`;
    }).join("") + `</div>`;
  } else if (s.type === "order") {
    const slots = s.items.map((_, k) => `
      <div class="slot ${v[k] !== undefined ? "fill" : ""}"><span class="n">${k + 1}</span><span>${v[k] !== undefined ? s.items[v[k]] : ""}</span></div>`).join("");
    const pool = s._order.filter(i => !v.includes(i)).map(i =>
      `<button type="button" class="chip" ${dis} data-act="ord-add" data-r="${r.id}" data-s="${si}" data-i="${i}">${s.items[i]}</button>`).join("");
    body = `<div class="seq">${slots}</div><div class="pool">${pool}</div>
      <div class="actions" style="margin-top:0">
        <button type="button" class="btn ghost" ${dis} data-act="ord-undo" data-r="${r.id}" data-s="${si}">Undo last</button>
        <button type="button" class="btn ghost" ${dis} data-act="ord-reset" data-r="${r.id}" data-s="${si}">Start again</button>
      </div>`;
  } else if (s.type === "match") {
    body = s.rows.map((row, k) => `
      <div class="row"><label for="m-${r.id}-${si}-${k}">${row.label}</label>
        <select id="m-${r.id}-${si}-${k}" ${dis} data-act="match" data-r="${r.id}" data-s="${si}" data-k="${k}">
          <option value="">Choose…</option>
          ${s.options.map((o, i) => `<option value="${i}" ${v[k] === i ? "selected" : ""}>${o}</option>`).join("")}
        </select></div>`).join("");
  } else if (s.type === "num") {
    body = s.fields.map((f, k) => `
      <div class="row"><label for="n-${r.id}-${si}-${k}">${f.label}</label>
        <input id="n-${r.id}-${si}-${k}" type="number" inputmode="decimal" ${dis} value="${v[k]}" data-act="num" data-r="${r.id}" data-s="${si}" data-k="${k}"></div>`).join("");
  }
  const note = solved || res === true ? `<p class="stage-note">Correct</p>` : res === false ? `<p class="stage-note">Not quite. Look at this one again.</p>` : "";
  return `<div class="stage ${cls}" id="stage-${si}"><h3>${s.q}</h3>${body}${note}</div>`;
}

function clueHTML(r) {
  const i = st.clue[r.id];
  if (i === undefined) return `<div class="clue empty" id="clue"><p>Tap an object to inspect it.</p></div>`;
  const o = r.objects[i];
  const body = o.html ? o.html : `<p><strong>${o.label}:</strong> ${o.text}</p>`;
  const fig = o.figure === "candida" ? candidaHTML() : "";
  return `<div class="clue" id="clue" role="status">${body}${fig}</div>`;
}
function hintsHTML(r) {
  const n = st.hintsShown[r.id] || 0;
  const shown = r.hints.slice(0, n).map((h, k) => `<div class="hint"><strong>Hint ${k + 1}:</strong> ${h}</div>`).join("");
  const more = n < r.hints.length && !st.solved[r.id]
    ? `<button type="button" class="btn ghost" data-act="hint" data-r="${r.id}">${n === 0 ? "Show a hint" : "Show another hint"}</button>` : "";
  return `<div class="hints" id="hints">${shown}${more}</div>`;
}

    <div class="panel">
      <h3>The lock</h3>
      <div id="stages">${stages}</div>
      ${solved ? "" : `<div class="actions"><button type="button" class="btn ribbon" data-act="check" data-r="${r.id}">Try the lock</button></div>
      <p class="fb ${st.msg[r.id] ? "bad" : ""}" id="fb" role="status">${st.msg[r.id] || ""}</p>`}
      ${hintsHTML(r)}

      <div class="stat"><b>${st.attempts}</b>Lock attempts</div>
    </div>
    <h2>Debrief</h2>
    <p>Open each room to revisit its teaching point. Mr A’s shingles eight months earlier was a missed chance to test. Testing, treatment and prevention only reach everyone when stigma is tackled too.</p>
    ${debrief}
    <div class="actions"><button type="button" class="btn" data-act="again">Play again</button></div>`;
}

function render() {
  let html = "";
  if (st.screen === "intro") html = introView();
  else if (st.screen === "hub") html = hubView();
  else if (st.screen === "room") html = roomView(roomById(st.roomId));
  else if (st.screen === "door") html = doorView();
  else if (st.screen === "win") html = winView();
  app.innerHTML = html;
  if (st.started) updateHeader();
}
function go(screen, roomId) {
  if (screen === "room" && !isUnlocked(roomId)) { screen = "hub"; roomId = null; }
  st.screen = screen;
  st.roomId = roomId || null;
  render();
  window.scrollTo(0, 0);
  app.focus({ preventScroll: true });
}

/* ---------- Partial refreshes ---------- */
function refreshStage(rid, si, focusSel) {
  const r = roomById(rid);
  const el = document.getElementById("stage-" + si);
  if (!el) return;
  el.outerHTML = stageHTML(r, si);
  if (focusSel) {
    const f = document.querySelector(focusSel);
    if (f) f.focus({ preventScroll: true });
  }
}

/* ---------- Actions ---------- */
function checkRoom(rid) {
  const r = roomById(rid);
  st.attempts++;
  const results = r.stages.map((s, i) => checkStage(s, getVal(rid, i, s)));
  st.res[rid] = results;
  const good = results.filter(Boolean).length;
  if (good === results.length) {
    st.solved[rid] = true;
    st.msg[rid] = "";
    render();
    const p = document.getElementById("solvedpanel");
    if (p) p.scrollIntoView({ behavior: "smooth", block: "start" });
  } else {
    st.msg[rid] = good + " of " + results.length + " parts correct. The parts outlined in red need another look.";
    r.stages.forEach((_, i) => refreshStage(rid, i));
    const fb = document.getElementById("fb");
    fb.textContent = st.msg[rid];
    fb.className = "fb bad";
  }
}

function unlock() {
  const input = document.getElementById("code");
  const v = (input.value || "").trim().toUpperCase();
  st.attempts++;
  if (v === FINAL_WORD) {
    st.finished = true;
    st.elapsed = Math.floor((Date.now() - st.startTime) / 1000);
    clearInterval(timerId);
    document.getElementById("timer").textContent = fmt(st.elapsed);
    go("win");
  } else {
    st.doorMsg = v.length < 8 ? "The override word has 8 letters." : "ACCESS DENIED. Something isn’t right. Go back and check the letters in position order, 1 to 8.";
    const fb = document.getElementById("fb");
    fb.textContent = st.doorMsg;
    fb.className = "fb bad";
    input.focus();
  }
}

function showKey() {
  const items = ROOMS.map(r => `<li><strong>Room ${r.id}, ${r.name} (letter ${r.pos}: ${r.letter}).</strong> ${r.key}</li>`).join("");
  const m = document.getElementById("modal");
  m.innerHTML = `<div class="modal"><h2 id="modal-title">Facilitator answer key</h2>
    <p>Final word: <strong>${FINAL_WORD}</strong>. Letters by position: ${ROOMS.slice().sort((a, b) => a.pos - b.pos).map(r => r.letter).join(", ")}.</p>
    <ol>${items}</ol>
    <div class="actions"><button type="button" class="btn" data-act="closekey" id="closekey">Close</button></div></div>`;
  m.classList.remove("hidden");
  document.getElementById("closekey").focus();
}
function hideKey() { document.getElementById("modal").classList.add("hidden"); }

/* ---------- Events ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]");
  if (!t) return;
  const act = t.dataset.act;
  const rid = t.dataset.r ? +t.dataset.r : null;
  const si = t.dataset.s !== undefined ? +t.dataset.s : null;
  const i = t.dataset.i !== undefined ? +t.dataset.i : null;
  const sel = (a) => `[data-act="${a}"][data-r="${rid}"][data-s="${si}"][data-i="${i}"]`;

  switch (act) {
    case "begin": startTimer(); go("hub"); break;
    case "hub": go("hub"); break;
    case "open": if (isUnlocked(rid)) go("room", rid); break;
    case "door": go("door"); break;
    case "unlock": unlock(); break;
    case "again": clearInterval(timerId); resetState(); document.getElementById("stats").classList.add("hidden"); go("intro"); break;
    case "key": showKey(); break;
    case "review": st.review = true; if (!st.started) startTimer(); go("hub"); break;
    case "comment": {
      if (!COMMENTS) break;
      const target = document.querySelector("#app .room-head") || document.querySelector("#app h2") || document.querySelector("#app h1") || app;
      COMMENTS.openComposer({ element: target }).catch(err => {
        if (err && ["unavailable", "not_granted", "forbidden"].includes(err.code)) {
          COMMENTS = null;
          document.getElementById("cbtn").classList.add("hidden");
        }
      });
      break;
    }
    case "closekey": hideKey(); break;
    case "clue": {
      st.clue[rid] = i;
      (st.seen[rid] || (st.seen[rid] = {}))[i] = true;
      const r = roomById(rid);
      document.getElementById("clue").outerHTML = clueHTML(r);
      document.querySelectorAll(".tile").forEach((b, k) => {
        b.classList.toggle("on", k === i);
        if (k === i) b.classList.add("seen");
      });
      break;
    }
    case "hint": {
      const r = roomById(rid);
      st.hintsShown[rid] = (st.hintsShown[rid] || 0) + 1;
      st.hints++;
      document.getElementById("hints").outerHTML = hintsHTML(r);
      updateHeader();
      break;
    }
    case "check": checkRoom(rid); break;
    case "chat-send": sendChat(rid); break;
    case "chat-stop": stopChat(rid); break;
    case "chat-fb": chatFeedback(rid); break;
    case "mcq": {
      setVal(rid, si, i);
      refreshStage(rid, si, sel("mcq"));
      break;
    }
    case "multi": {
      const s = roomById(rid).stages[si];
      const v = getVal(rid, si, s);
      const k = v.indexOf(i);
      if (k >= 0) v.splice(k, 1); else v.push(i);
      refreshStage(rid, si, sel("multi"));
      break;
    }
    case "ord-add": {
      const s = roomById(rid).stages[si];
      getVal(rid, si, s).push(i);
      refreshStage(rid, si);
      break;
    }
    case "ord-undo": {
      const s = roomById(rid).stages[si];
      getVal(rid, si, s).pop();
      refreshStage(rid, si);
      break;
    }
    case "ord-reset": {
      setVal(rid, si, []);
      refreshStage(rid, si);
      break;
    }
  }
});

document.addEventListener("change", e => {
  const t = e.target;
  if (t && t.id === "ttsbox") {
    ttsOn = t.checked;
    if (!ttsOn && TTS) TTS.stop();
    return;
  }
  if (t.dataset && t.dataset.act === "match") {
    const rid = +t.dataset.r, si = +t.dataset.s, k = +t.dataset.k;
    const s = roomById(rid).stages[si];
    getVal(rid, si, s)[k] = t.value === "" ? null : +t.value;
  }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset && t.dataset.act === "num") {
    const rid = +t.dataset.r, si = +t.dataset.s, k = +t.dataset.k;
    const s = roomById(rid).stages[si];
    getVal(rid, si, s)[k] = t.value;
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") hideKey();
  if (e.key === "Enter" && e.target && e.target.id === "code") unlock();
  if (e.key === "Enter" && e.target && e.target.id === "chatin") { e.preventDefault(); sendChat(st.roomId); }
});

resetState();
render();

if (window.claude && typeof window.claude.use === "function") {
  window.claude.use("sample").then(fn => { SAMPLE = fn || null; refreshChatPanel(); }).catch(() => {});
  window.claude.use("tts").then(t => { TTS = t || null; refreshChatPanel(); }).catch(() => {});
  window.claude.use("comments").then(c => { COMMENTS = c || null; if (COMMENTS) document.getElementById("cbtn").classList.remove("hidden"); }).catch(() => {});
}
</script>
</body>
</html>
